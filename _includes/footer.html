<link id="fa-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.0/css/all.min.css">

<footer class="site-footer h-card">
  <data class="u-url" value="{{ '/' | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col">
      {%- if site.author %}
        <ul class="contact-list">
          {% if site.author.name -%}
            <li class="p-name">{{ site.author.name | escape }}</li>
          {% endif -%}
          {% if site.author.email -%}
            <li><a class="u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></li>
          {%- endif %}
        </ul>
      {%- endif %}
      </div>
      <div class="footer-col">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

    <div class="social-links">
      {%- include social.html -%}
    </div>

    <div class="academic-links">
      <a href="https://amazon.com/author/piveta" title="Página do autor na Amazon">
        <i class="fa-brands fa-amazon"></i>
      </a>

      <a href="https://scholar.google.com.br/citations?user=aC0NGYcAAAAJ" title="Google Scholar">
        <i class="fa-brands fa-google-scholar"></i>
      </a>

      <a href="http://dblp.uni-trier.de/pers/hd/p/Piveta:Eduardo_Kessler" title="DBLP">
        <i class="fa-solid fa-book"></i>
      </a>
    </div>

  </div>

</footer>
