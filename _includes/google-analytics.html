<!-- Google tag (gtag.js) -->
{% if page.url != "/" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics | url_encode }}"></script>
{% endif %}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', {{ site.google_analytics | jsonify }});

  {% if page.url == "/" %}
  window.addEventListener('load', function () {
    var tag = document.createElement('script');
    tag.async = true;
    tag.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics | url_encode }}';
    document.head.appendChild(tag);
  }, { once: true });
  {% endif %}
</script>
