<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  {% capture seo_metadata %}{% seo %}{% endcapture %}
  {% comment %}SEO Tag 2.8 emits its JSON-LD last. Keep the metadata and use our shared graph.{% endcomment %}
  {% assign seo_tags = seo_metadata | split: '<script type="application/ld+json">' | first %}
  {% assign og_locale = site.data.seo_locales[current_language].locale | default: 'pt_BR' %}
  {% assign og_tag = '<meta property="og:locale" content="' | append: og_locale | append: '"' %}
  {{ seo_tags | replace: '<meta property="og:locale" content="pt_BR"', og_tag }}
  {% if page.robots %}<meta name="robots" content="{{ page.robots | escape }}">{% endif %}
  {% include structured-data.html %}

  {% if page.url == "/" %}
    <style>{{ '@import "site-styles";' | scssify }}</style>
  {% else %}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {% endif %}

  {%- feed_meta -%}

  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  {% include alternate-pages.html %}
  {% for alternate in alternate_pages %}
    <link rel="alternate" hreflang="{{ alternate.lang | escape }}" href="{{ alternate.url | absolute_url }}">
  {% endfor %}
  {% assign portuguese_page = alternate_pages | where: "lang", site.lang | first %}
  {% if portuguese_page %}
    <link rel="alternate" hreflang="x-default" href="{{ portuguese_page.url | absolute_url }}">
  {% endif %}

</head>
