<ul class="social-media-list">
  {%- for entry in site.minima.social_links %}
  <li>
    <a rel="me" href="{{ entry.url }}" target="_blank">{{ entry.title | escape }}</a>
  </li>
  {%- endfor %}
  <li>
    <a href="https://amazon.com/author/piveta" target="_blank">Amazon</a>
  </li>
  <li>
    <a href="https://scholar.google.com.br/citations?user=aC0NGYcAAAAJ" target="_blank">Google Scholar</a>
  </li>
  <li>
    <a href="http://dblp.uni-trier.de/pers/hd/p/Piveta:Eduardo_Kessler" target="_blank">DBLP</a>
  </li>
  {%- unless site.minima.hide_site_feed_link %}
  <li>
    <a href="{{ site.feed.path | default: 'feed.xml' | absolute_url }}" target="_blank">{{ locale.feed | escape }}</a>
  </li>
  {%- endunless %}
</ul>
