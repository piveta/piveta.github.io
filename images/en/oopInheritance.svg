<svg xmlns="http://www.w3.org/2000/svg" width="728" height="464" viewBox="0 0 728 464" role="img" aria-labelledby="title desc">
  <title id="title">Inheritance among geometric shapes</title><desc id="desc">Rectangle, Triangle, and Circle extend Shape.</desc>
  <defs>
    <linearGradient id="box" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ddd"/></linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M1 13 7 1 13 13Z" fill="white" stroke="#111" stroke-width="1.8"/></marker>
  </defs>
  <g stroke="#111" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M161 360 327 125"/><path d="M382 360 382 125"/><path d="M591 360 427 125"/>
  </g>
  <g fill="url(#box)" stroke="#111" stroke-width="2.5">
    <rect x="299" y="11" width="167" height="113"/><rect x="11" y="360" width="218" height="113"/>
    <rect x="275" y="360" width="215" height="113"/><rect x="538" y="360" width="180" height="113"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="29" text-anchor="middle" fill="#111">
    <text x="382" y="75">Shape</text><text x="120" y="423">Rectangle</text>
    <text x="382" y="423">Triangle</text><text x="628" y="423">Circle</text>
  </g>
</svg>
