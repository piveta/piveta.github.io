---
layout: page
title: Todos os posts
permalink: /posts/
---

<p>Arquivo completo de artigos, em todos os idiomas, do mais recente ao mais antigo.</p>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d/%m/%Y" }}</time>
      <span lang="{{ post.lang | default: site.lang }}">[{{ post.lang | default: site.lang }}]</span>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
